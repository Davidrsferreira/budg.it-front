<h2 mat-dialog-title>Excluir receita</h2>

<mat-dialog-content>
  <p>
    Tem certeza que deseja excluir a receita
    <strong>{{ income.description }}</strong
    >?
  </p>

  <p>Essa ação não poderá ser desfeita.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancelar</button>

  <button mat-flat-button type="button" (click)="onConfirm()">Excluir</button>
</mat-dialog-actions>

<h2 mat-dialog-title>
  {{ isEditMode ? 'Editar conta' : 'Nova conta' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field>
      <mat-label>Nome</mat-label>

      <input matInput formControlName="name" placeholder="Ex.: Conta principal" />

      @if (form.controls.name.hasError('required')) {
        <mat-error> Informe o nome da conta. </mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Banco</mat-label>

      <mat-select formControlName="bank">
        @for (bank of banks; track bank) {
          <mat-option [value]="bank">{{ bank }}</mat-option>
        }
      </mat-select>

      @if (form.controls.bank.hasError('required')) {
        <mat-error> Informe o banco. </mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancelar</button>

  <button mat-flat-button type="button" (click)="onSubmit()">
    {{ isEditMode ? 'Salvar alterações' : 'Salvar' }}
  </button>
</mat-dialog-actions>

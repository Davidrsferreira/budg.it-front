<div class="space-y-6">
  <!-- Header -->
  <header class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold">Contas</h1>
      <p>Gerencie suas contas</p>
    </div>

    <button mat-flat-button (click)="onCreateAccount()">
      <mat-icon>add</mat-icon>
      Nova conta
    </button>
  </header>

  <!-- Accounts -->
  <section>
    <div class="mb-4">
      <h2 class="text-xl font-semibold">Minhas contas</h2>
    </div>

    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      @for (account of accountsStore.accounts(); track account.id) {
        <mat-card>
          <mat-card-header>
            <mat-icon mat-card-avatar> account_balance </mat-icon>

            <mat-card-title>
              {{ account.name }}
            </mat-card-title>

            <mat-card-subtitle>
              {{ account.bank }}
            </mat-card-subtitle>
          </mat-card-header>

          <mat-card-actions align="end">
            <button mat-button (click)="onEditAccount(account)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>

            <button mat-button (click)="onDeleteAccount(account)">
              <mat-icon>delete</mat-icon>
              Excluir
            </button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </section>
</div>
